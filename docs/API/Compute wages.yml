info:
  name: Compute wages
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/alliances/EMP/wages?distribution=minimal"
  params:
    - name: distribution
      value: minimal
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
